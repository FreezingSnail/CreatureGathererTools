[package]
name = "cgfx-app"
version = "0.1.0"
description = "Tauri 2 shell for CreatureGathererFX"
edition = "2021"

[lib]
name = "cgfx_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0"
cgfx-core = { path = "../crates/core" }
