[package]
name = "cgfx-core"
version = "0.3.0"
edition = "2024"
build = "build.rs"

[lib]
name = "creaturevm"
path = "src/lib.rs"

[[bin]]
name = "cgfx-tools"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = "=0.4.45"
clap   = { version = "4.5", features = ["derive"] }
png = "=0.17.16"
serde  = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "=0.10.9"
cgfx-wfc = { path = "../wfc" }
toml = "=0.8.19"
